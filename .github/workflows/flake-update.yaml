name: Bump flake.lock

on:
  schedule:
    - cron: "0 6 * * 0"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: Update
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31

      # secrets is private and only changes alongside a local rebuild, so bump
      # everything else; CI then never needs credentials
      - run: jq -r '.nodes.root.inputs | keys - ["secrets"] | .[]' flake.lock | xargs nix flake update

      # skipping the checks also skips the commit, which needs them
      - id: diff
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flake-lock
          path: flake.lock

  check-linux:
    name: Check (Linux)
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock

      # full desktop closures don't fit in the runner's default free space
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31

      - run: nix flake check --override-input secrets path:./ci/stub-secrets --keep-going

  # Apple Silicon runner, so checks.nix picks up the aarch64-darwin home configs
  check-darwin:
    name: Check (Darwin)
    needs: update
    if: needs.update.outputs.changed == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock

      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31

      - run: nix flake check --override-input secrets path:./ci/stub-secrets --keep-going

  commit:
    name: Commit
    needs: [check-linux, check-darwin]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flake-lock

      - uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9 # v7
        with:
          commit_message: Bump flake.lock
          branch: main
          commit_options: "--no-verify --signoff"
          file_pattern: flake.lock
          commit_user_name: Flake Bot # defaults to "GitHub Actions"
          commit_author: Flake Bot <actions@github.com> # defaults to author of the commit that triggered the run
          skip_dirty_check: false
          skip_fetch: true
