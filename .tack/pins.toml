# tack pins. generated by flake-file write-tack.
# nix reads pins.lock.json; this file drives tack update

[tack]
recomposable = true

[all_follow]
flake-parts = "flake-parts"
home-manager = "home-manager"
nixpkgs = "nixpkgs"
nixpkgs-stable = "nixpkgs"

[inputs.bark]
url = "github:JacobGDG/bark"

[inputs.disko]
url = "github:nix-community/disko"

[inputs.flake-file]
url = "github:vic/flake-file"

[inputs.flake-parts]
url = "github:hercules-ci/flake-parts"

[inputs.home-manager]
url = "github:nix-community/home-manager/release-26.05"

[inputs.impermanance]
url = "github:nix-community/impermanence"

[inputs.import-tree]
url = "github:denful/import-tree"

[inputs.neovim]
url = "github:JacobGDG/nvim.nix"

[inputs.nixpkgs]
url = "github:nixos/nixpkgs/nixos-26.05"

[inputs.nixpkgs-unstable]
url = "github:nixos/nixpkgs/nixos-unstable"

[inputs.ragenix]
url = "github:JacobGDG/ragenix"

[inputs.secrets]
url = "git+ssh://git@github.com/JacobGDG/nix-secrets.git?shallow=1"
type = "fetch"

[inputs.tack]
url = "github:manic-systems/tack"
